[project]
name = "restaurant-voice-agent"
version = "0.1.0"
description = "LiveKit restaurant reservation voice agent with a polished owner dashboard."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.8.0",
  "livekit-api>=1.0.0",
  "livekit-agents[cartesia,cerebras,openai,xai]~=1.5",
  "livekit-plugins-ai-coustics>=0.2.14,<0.3",
  "livekit-plugins-silero~=1.5",
  "livekit-plugins-turn-detector~=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
